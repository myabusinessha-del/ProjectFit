services:
  - type: web
    name: projectfit
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: python -c "import base64,gzip;open('service.py','wb').write(gzip.decompress(base64.b64decode(open('service_min.py.gz.b64','rb').read())))" && pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: PROJECTFIT_SECURE_COOKIES
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false