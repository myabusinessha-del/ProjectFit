<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProjectFit — Work on yourself.</title>
<style>
body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:#f5f6f8;color:#17191d}
header{background:#15171b;color:#fff;padding:18px 24px;display:flex;justify-content:space-between}
.wrap{max-width:1100px;margin:24px auto;padding:0 16px}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 10px #0001;margin-bottom:14px}
.form{display:grid;gap:10px}.form input{padding:12px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box;width:100%}
button{border:0;border-radius:10px;padding:11px 15px;background:#fff;box-shadow:0 1px 4px #0002;cursor:pointer}
button.primary,.active{background:#15171b;color:#fff}.row{display:flex;gap:8px;flex-wrap:wrap}.muted{color:#6d727b}.hidden{display:none}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.big{font-size:28px;font-weight:700}.exercise{padding:12px 0;border-top:1px solid #eee}.tag{display:inline-block;background:#eef0f3;border-radius:20px;padding:5px 8px;font-size:12px;margin:3px}
#authmsg{min-height:22px}.toast{position:fixed;right:20px;bottom:20px;background:#15171b;color:white;padding:12px 16px;border-radius:10px;display:none}
</style>
</head>
<body>
<header><strong>ProjectFit</strong><span>Work on yourself.</span></header>
<main class="wrap">
<section id="auth" class="card">
<h2>Welcome to ProjectFit</h2>
<p class="muted">Your workouts, nutrition and progress in one place.</p>
<div class="form">
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password (8+ characters)">
<input id="name" placeholder="Name (for new accounts)">
<div class="row">
<button type="button" id="login">Log in</button>
<button type="button" id="register" class="primary">Create account</button>
<button type="button" id="recover">Forgot password?</button>
</div>
<div id="authmsg" class="muted"></div>
</div>
</section>
<section id="app" class="hidden">
<div class="nav">
<button type="button" data-page="home">Home</button>
<button type="button" data-page="workout">Workout</button>
<button type="button" data-page="nutrition">Nutrition</button>
<button type="button" data-page="progress">Progress</button>
<button type="button" data-page="profile">Profile</button>
</div>
<div id="page"></div>
</section>
</main>
<div id="toast" class="toast"></div>
<script>
"use strict";
var state={user:null};

function $(id){return document.getElementById(id);}
function setMessage(text){$("authmsg").textContent=text||"";}
function showToast(text){var t=$("toast");t.textContent=text;t.style.display="block";setTimeout(function(){t.style.display="none";},2500);}
function escapeText(value){return String(value==null?"":value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function api(path,options){
  var opts=options||{};
  opts.headers=Object.assign({"Content-Type":"application/json"},opts.headers||{});
  return fetch(path,opts).then(function(response){
    return response.json().catch(function(){return {};}).then(function(data){
      if(!response.ok){throw new Error(data.error||data.message||("Request failed: "+response.status));}
      return data;
    });
  });
}

function login(){
  var email=$("email").value.trim(), password=$("password").value;
  if(!email||!password){setMessage("Please enter your email and password.");return;}
  setMessage("Logging in...");
  api("/api/auth/cloud/login",{method:"POST",body:JSON.stringify({email:email,password:password})})
    .then(function(data){state.user=data.user;openApp();})
    .catch(function(error){setMessage(error.message);});
}

function register(){
  var email=$("email").value.trim(), password=$("password").value, name=$("name").value.trim();
  if(!email||!password){setMessage("Please enter your email and password.");return;}
  if(password.length<8){setMessage("Password must be at least 8 characters.");return;}
  setMessage("Creating your account...");
  api("/api/auth/cloud/register",{method:"POST",body:JSON.stringify({email:email,password:password,display_name:name})})
    .then(function(data){
      if(data.verification_required){setMessage(data.message||"Account created. Check your email, then log in.");return;}
      state.user=data.user;openApp();
    })
    .catch(function(error){setMessage(error.message||"Could not create account.");});
}

function recover(){
  var email=$("email").value.trim();
  if(!email){setMessage("Enter your email address first.");return;}
  setMessage("Sending reset email...");
  api("/api/auth/cloud/recover",{method:"POST",body:JSON.stringify({email:email,redirect_to:location.origin})})
    .then(function(data){setMessage(data.message||"Check your email.");})
    .catch(function(error){setMessage(error.message);});
}

function openApp(){$("auth").classList.add("hidden");$("app").classList.remove("hidden");showPage("home");}

function showPage(name){
  document.querySelectorAll("[data-page]").forEach(function(button){button.classList.toggle("active",button.getAttribute("data-page")===name);});
  if(name==="home")loadHome();
  if(name==="workout")loadWorkout();
  if(name==="nutrition")loadNutrition();
  if(name==="progress")loadProgress();
  if(name==="profile")loadProfile();
}

function fail(error){$("page").innerHTML="<div class='card'><b>"+escapeText(error.message)+"</b></div>";}

function loadHome(){
  api("/api/home").then(function(d){
    $("page").innerHTML="<div class='grid'>"+
      "<div class='card'><div class='muted'>Week</div><div class='big'>"+d.week+"</div><div>"+escapeText(d.day)+" · "+escapeText(d.session)+"</div></div>"+
      "<div class='card'><div class='muted'>Weight</div><div class='big'>"+(d.weight||"—")+" kg</div><div class='muted'>7-day average "+(d.seven_day_average||"—")+"</div></div>"+
      "<div class='card'><div class='muted'>Calories</div><div class='big'>"+Math.round(d.nutrition.calories)+" / "+d.nutrition.calorie_target+"</div></div>"+
      "<div class='card'><div class='muted'>Protein</div><div class='big'>"+Math.round(d.nutrition.protein)+" / "+d.nutrition.protein_target+" g</div></div></div>"+
      "<div class='card'><h2>Today's plan</h2><p class='muted'>Open Workout to log your sets.</p></div>";
  }).catch(fail);
}

function loadWorkout(){
  api("/api/programme").then(function(d){
    var html="<div class='card'><h2>"+escapeText(d.session)+"</h2><p class='muted'>Week "+d.week+" · "+d.date+"</p>";
    (d.exercises||[]).forEach(function(x,i){
      html+="<div class='exercise'><b>"+escapeText(x.exercise)+"</b><br><span class='tag'>"+x.sets+" sets · "+escapeText(x.rep_range)+"</span><span class='tag'>Target "+x.today_target+" kg</span></div>";
    });
    html+="</div>";
    $("page").innerHTML=html;
  }).catch(fail);
}

function loadNutrition(){
  api("/api/nutrition").then(function(d){
    $("page").innerHTML="<div class='grid'><div class='card'><div class='muted'>Calories</div><div class='big'>"+Math.round(d.calories)+" / "+d.calorie_target+"</div></div>"+
      "<div class='card'><div class='muted'>Protein</div><div class='big'>"+Math.round(d.protein)+" / "+d.protein_target+" g</div></div>"+
      "<div class='card'><div class='muted'>Remaining</div><div class='big'>"+Math.round(d.remaining_calories)+" kcal</div></div></div>"+
      "<div class='card'><h2>Today's entries</h2>"+(d.entries||[]).map(function(x){return "<div class='exercise'><b>"+escapeText(x.food)+"</b> · "+escapeText(x.meal)+"<br><span class='muted'>"+x.calories+" kcal · "+x.protein+" g protein</span></div>";}).join("")+"</div>";
  }).catch(fail);
}

function loadProgress(){
  Promise.all([api("/api/progress"),api("/api/review")]).then(function(all){
    var d=all[0],r=all[1],m=d.measurements||[];
    $("page").innerHTML="<div class='grid'><div class='card'><div class='muted'>Latest weight</div><div class='big'>"+(m.length?m[m.length-1].weight:"—")+" kg</div></div>"+
      "<div class='card'><div class='muted'>Coach review</div><div class='big'>"+escapeText(r.review_state)+"</div><div>"+escapeText(r.next_action)+"</div></div></div>";
  }).catch(fail);
}

function loadProfile(){
  api("/api/profile").then(function(d){
    $("page").innerHTML="<div class='card'><h2>Profile</h2><p><b>"+escapeText(d.user.display_name)+"</b><br><span class='muted'>"+escapeText(d.user.email||"")+"</span></p>"+
      "<button type='button' id='sync'>Sync now</button> <button type='button' id='logout'>Log out</button></div>";
    $("sync").addEventListener("click",function(){api("/api/cloud/sync",{method:"POST",body:"{}"}).then(function(x){showToast("Synced "+x.downloaded+" records.");}).catch(function(e){showToast(e.message);});});
    $("logout").addEventListener("click",function(){api("/api/auth/cloud/logout",{method:"POST",body:"{}"}).then(function(){location.reload();});});
  }).catch(fail);
}

document.addEventListener("DOMContentLoaded",function(){
  $("login").addEventListener("click",login);
  $("register").addEventListener("click",register);
  $("recover").addEventListener("click",recover);
  document.querySelectorAll("[data-page]").forEach(function(button){button.addEventListener("click",function(){showPage(button.getAttribute("data-page"));});});
  api("/api/auth/me").then(function(data){if(data.authenticated){state.user=data.user;openApp();}}).catch(function(){});
});
</script>
</body>
</html>
