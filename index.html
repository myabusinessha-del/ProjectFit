<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProjectFit — Work on yourself.</title><style>body{margin:0;font-family:Inter,system-ui,Arial;background:#f5f6f8;color:#17191d}header{background:#15171b;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}header b{font-size:22px}.wrap{max-width:1100px;margin:24px auto;padding:0 16px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.nav button,.btn{border:0;border-radius:10px;padding:10px 14px;background:#fff;box-shadow:0 1px 4px #0001;cursor:pointer}.nav button.active,.btn.primary{background:#15171b;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 10px #0000000b}.big{font-size:30px;font-weight:750}.muted{color:#6d727b}.bar{height:9px;background:#e7e9ed;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#15171b}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.form{display:grid;gap:10px}.form input,.form select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d9dce1;border-radius:9px}.hidden{display:none}.tag{display:inline-block;padding:5px 8px;border-radius:99px;background:#eef0f3;font-size:12px}.exercise{border-top:1px solid #eee;padding:14px 0}.exercise:first-child{border-top:0}.toast{position:fixed;right:18px;bottom:18px;background:#15171b;color:#fff;padding:12px 16px;border-radius:10px;display:none}@media(max-width:600px){header{padding:14px 16px}.wrap{margin:14px auto}.card{padding:15px}}</style></head><body><header><b>ProjectFit</b><span>Work on yourself.</span></header><main class="wrap"><section id="auth" class="card"><h2>Welcome to ProjectFit</h2><p class="muted">Your workouts, nutrition and progress in one place.</p><div class="form"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password (8+ characters)"><input id="name" placeholder="Name (for new accounts)"><div class="row"><button class="btn primary" onclick="login()">Log in</button><button class="btn" onclick="register()">Create account</button><button class="btn" onclick="recover()">Forgot password?</button></div><small id="authmsg" class="muted"></small></div></section><section id="app" class="hidden"><div class="nav"><button onclick="show('home')" id="n-home">Home</button><button onclick="show('workout')" id="n-workout">Workout</button><button onclick="show('nutrition')" id="n-nutrition">Nutrition</button><button onclick="show('progress')" id="n-progress">Progress</button><button onclick="show('profile')" id="n-profile">Profile</button></div><div id="page"></div></section></main><div id="toast" class="toast"></div><script>var state={};function toast(x){var t=document.getElementById('toast');t.textContent=x;t.style.display='block';setTimeout(function(){t.style.display='none'},2500)}async function api(path,opt){var r=await fetch(path,Object.assign({headers:{'Content-Type':'application/json'}},opt||{}));var j=await r.json();if(!r.ok)throw Error(j.error||j.message||'Request failed');return j}async function login(){try{var j=await api('/api/auth/cloud/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});state.user=j.user;await start();}catch(e){authmsg.textContent=e.message}}async function register(){try{var j=await api('/api/auth/cloud/register',{method:'POST',body:JSON.stringify({email:email.value,password:password.value,display_name:name.value})});if(j.verification_required){authmsg.textContent=j.message;return}state.user=j.user;await start()}catch(e){authmsg.textContent=e.message}}async function recover(){try{var j=await api('/api/auth/cloud/recover',{method:'POST',body:JSON.stringify({email:email.value,redirect_to:location.origin})});authmsg.textContent=j.message||'Check your email.'}catch(e){authmsg.textContent=e.message}}async function start(){document.getElementById('auth').classList.add('hidden');document.getElementById('app').classList.remove('hidden');show('home')}async function show(p){document.querySelectorAll('.nav button').forEach(function(b){b.classList.remove('active')});document.getElementById('n-'+p).classList.add('active');try{if(p==='home')await home();if(p==='workout')await workout();if(p==='nutrition')await nutrition();if(p==='progress')await progress();if(p==='profile')await profile()}catch(e){page.innerHTML='<div class="card"><b>'+e.message+'</b></div>'}}function pct(a,b){return b?Math.max(0,Math.min(100,a/b*100)):0}async function home(){var j=await api('/api/home');page.innerHTML='<div class="grid"><div class="card"><div class="muted">Week</div><div class="big">'+j.week+'</div><div>'+j.day+' · '+j.session+'</div></div><div class="card"><div class="muted">Weight</div><div class="big">'+(j.weight||'—')+' kg</div><div class="muted">7-day average '+(j.seven_day_average||'—')+'</div></div><div class="card"><div class="muted">Calories</div><div class="big">'+Math.round(j.nutrition.calories)+' / '+j.nutrition.calorie_target+'</div><div class="bar"><i style="width:'+pct(j.nutrition.calories,j.nutrition.calorie_target)+'%"></i></div></div><div class="card"><div class="muted">Protein</div><div class="big">'+Math.round(j.nutrition.protein)+' / '+j.nutrition.protein_target+' g</div><div class="bar"><i style="width:'+pct(j.nutrition.protein,j.nutrition.protein_target)+'%"></i></div></div></div><div class="card" style="margin-top:14px"><h2>Today's plan</h2><p class="muted">Log each exercise from the Workout tab. ProjectFit will calculate the next recommendation.</p>'+j.today_exercises.map(function(x){return '<div class="exercise"><b>'+x.exercise+'</b><br><span class="tag">'+x.sets+' sets</span> <span class="tag">'+x.rep_range+' reps</span> <span class="tag">Target '+x.today_target+' kg</span></div>'}).join('')+'</div>'}async function workout(){var j=await api('/api/programme');page.innerHTML='<div class="card"><h2>'+j.session+'</h2><p class="muted">Week '+j.week+' · '+j.date+'</p>'+j.exercises.map(function(x,i){return '<div class="exercise"><b>'+x.exercise+'</b><div class="row"><span class="tag">'+x.sets+' sets · '+x.rep_range+'</span><span class="tag">Target '+x.today_target+' kg</span></div><div class="form" style="margin-top:9px"><input id="kg'+i+'" type="number" step="0.5" placeholder="Actual kg"><input id="reps'+i+'" placeholder="Reps per set e.g. 10,9,8,8"><div class="row"><select id="form'+i+'"><option value="Yes">Form good</option><option value="No">Form needs work</option></select><input id="rir'+i+'" type="number" step="0.5" placeholder="Average RIR"></div><button class="btn primary" onclick="logex('+i+',\''+x.exercise.replace(/'/g,"\\'")+'\','+x.sets+',\''+x.rep_range+'\','+x.today_target+')">Save exercise</button></div></div>'}).join('')}</div>'}async function logex(i,ex,sets,rr,target){try{var reps=(document.getElementById('reps'+i).value||'').split(',').map(function(x){return Number(x.trim())}).filter(function(x){return isFinite(x)});var j=await api('/api/workouts/log',{method:'POST',body:JSON.stringify({date:new Date().toISOString().slice(0,10),session:state.session||'Workout',exercise:ex,target_sets:sets,rep_range:rr,recommended_kg:target,actual_kg:Number(document.getElementById('kg'+i).value),reps:reps,avg_rir:Number(document.getElementById('rir'+i).value),form_good:document.getElementById('form'+i).value,completed:'Yes'})});toast(j.recommendation||'Saved')}catch(e){toast(e.message)}}async function nutrition(){var j=await api('/api/nutrition');page.innerHTML='<div class="grid"><div class="card"><div class="muted">Calories</div><div class="big">'+Math.round(j.calories)+' / '+j.calorie_target+'</div></div><div class="card"><div class="muted">Protein</div><div class="big">'+Math.round(j.protein)+' / '+j.protein_target+' g</div></div><div class="card"><div class="muted">Remaining</div><div class="big">'+Math.round(j.remaining_calories)+' kcal</div><div>'+Math.round(j.remaining_protein)+' g protein</div></div></div><div class="card" style="margin-top:14px"><h2>Add food</h2><div class="form"><div class="row"><input id="food" placeholder="Food"><input id="meal" placeholder="Meal"></div><div class="row"><input id="cal" type="number" placeholder="Calories"><input id="pro" type="number" placeholder="Protein g"><input id="carb" type="number" placeholder="Carbs g"><input id="fat" type="number" placeholder="Fat g"></div><button class="btn primary" onclick="addfood()">Add food</button></div><h2>Today's entries</h2>'+j.entries.map(function(x){return '<div class="exercise"><b>'+x.food+'</b> · '+x.meal+'<br><span class="muted">'+x.calories+' kcal · '+x.protein+' g protein</span></div>'}).join('')+'</div>'}async function addfood(){try{await api('/api/nutrition',{method:'POST',body:JSON.stringify({date:new Date().toISOString().slice(0,10),food:food.value,meal:meal.value,calories:Number(cal.value),protein:Number(pro.value),carbs:Number(carb.value),fat:Number(fat.value),fibre:0})});toast('Food added');nutrition()}catch(e){toast(e.message)}}async function progress(){var j=await api('/api/progress'),r=await api('/api/review');var m=j.measurements||[];page.innerHTML='<div class="grid"><div class="card"><div class="muted">Latest weight</div><div class="big">'+(m.length?m[m.length-1].weight:'—')+' kg</div></div><div class="card"><div class="muted">Coach review</div><div class="big" style="font-size:22px">'+r.review_state+'</div><div>'+r.next_action+'</div></div></div><div class="card" style="margin-top:14px"><h2>Weight history</h2>'+m.slice(-14).reverse().map(function(x){return '<div class="exercise"><b>'+x.measurement_date+'</b><span style="float:right">'+x.weight+' kg</span></div>'}).join('')+'</div>'}async function profile(){var j=await api('/api/profile');page.innerHTML='<div class="card"><h2>Profile</h2><p><b>'+j.user.display_name+'</b><br><span class="muted">'+(j.user.email||'')+'</span></p><div class="grid"><div><label>Name</label><input id="pname" value="'+(j.user.display_name||'')+'" style="width:100%;box-sizing:border-box;padding:10px"></div><div><label>Age</label><input id="pagev" type="number" value="'+(j.user.age||'')+'" style="width:100%;box-sizing:border-box;padding:10px"></div><div><label>Height cm</label><input id="pheight" type="number" value="'+(j.user.height_cm||'')+'" style="width:100%;box-sizing:border-box;padding:10px"></div><div><label>Calories</label><input id="pcal" type="number" value="'+j.goal.calorie_target+'" style="width:100%;box-sizing:border-box;padding:10px"></div><div><label>Protein g</label><input id="ppro" type="number" value="'+j.goal.protein_target+'" style="width:100%;box-sizing:border-box;padding:10px"></div></div><br><button class="btn primary" onclick="saveprofile()">Save profile</button> <button class="btn" onclick="sync()">Sync now</button> <button class="btn" onclick="logout()">Log out</button><p class="muted">Cloud account: your durable application data is stored in ProjectFit's Supabase backend. Local SQLite is used as the app cache.</p></div>'}async function saveprofile(){try{await api('/api/profile',{method:'POST',body:JSON.stringify({display_name:pname.value,age:Number(pagev.value),height_cm:Number(pheight.value),calorie_target:Number(pcal.value),protein_target:Number(ppro.value)})});toast('Saved')}catch(e){toast(e.message)}}async function sync(){try{var j=await api('/api/cloud/sync',{method:'POST',body:'{}'});toast('Synced '+j.downloaded+' records')}catch(e){toast(e.message)}}async function logout(){try{await api('/api/auth/cloud/logout',{method:'POST',body:'{}'})}finally{location.reload()}}async function init(){try{var j=await api('/api/auth/me');if(j.authenticated){state.user=j.user;await start()}}catch(e){}}init()</script></body></html>
